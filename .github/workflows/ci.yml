name: CI

# Terax ADE is a Windows-only fork: one job on windows-latest runs every quality gate
# (docs/ade/DECISIONS.md section 9). Upstream's Linux, macOS and coverage jobs are dropped.

on:
  pull_request:
    branches: [ade/main]
  push:
    branches: [ade/main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: taiki-e/install-action@v2.87.22
        with:
          tool: cargo-nextest

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Size budget
        run: pnpm size

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo nextest
        working-directory: src-tauri
        run: cargo nextest run --locked
